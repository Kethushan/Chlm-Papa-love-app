name: Build APKs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP_FILE=""
          for f in *; do
            if [ -f "$f" ] && file "$f" | grep -qi "Zip archive"; then
              ZIP_FILE="$f"
              break
            fi
          done
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip archive found in the repo root (checked file contents, not just names)."
            echo "Files present:"
            ls -la
            exit 1
          fi
          echo "Found zip: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .

      - name: Add Firebase config
        run: |
          CONFIG_FILE=""
          for f in *; do
            if [ -f "$f" ] && grep -q '"project_info"' "$f" 2>/dev/null; then
              CONFIG_FILE="$f"
              break
            fi
          done
          if [ -z "$CONFIG_FILE" ]; then
            echo "google-services.json not found in repo root (checked file contents)."
            exit 1
          fi
          echo "Found Firebase config: $CONFIG_FILE"
          cp "$CONFIG_FILE" papachlm-love/app/google-services.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Chlm APK
        run: gradle assembleChlmRelease --console=plain -p papachlm-love

      - name: Build Papa APK
        run: gradle assemblePapaRelease --console=plain -p papachlm-love

      - name: Upload Chlm APK
        uses: actions/upload-artifact@v4
        with:
          name: app-chlm-release-unsigned
          path: papachlm-love/app/build/outputs/apk/chlm/release/*.apk

      - name: Upload Papa APK
        uses: actions/upload-artifact@v4
        with:
          name: app-papa-release-unsigned
          path: papachlm-love/app/build/outputs/apk/papa/release/*.apk
